name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          VITE_SF_LOGIN_URL: ${{ secrets.VITE_SF_LOGIN_URL }}
          VITE_SF_CLIENT_ID: ${{ secrets.VITE_SF_CLIENT_ID }}
          VITE_SF_CLIENT_SECRET: ${{ secrets.VITE_SF_CLIENT_SECRET }}
          VITE_SF_USERNAME: ${{ secrets.VITE_SF_USERNAME }}
          VITE_SF_PASSWORD: ${{ secrets.VITE_SF_PASSWORD }}
      
      - name: Copy 404.html to dist
        run: cp 404.html dist/404.html
      
      - name: Prepare deployment
        run: touch ./dist/.nojekyll
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
